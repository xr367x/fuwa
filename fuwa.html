<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暗記マスター</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--accent:#4f8cff;--text:#fff;--muted:#aab;}
*{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--text)}
.page{display:none;padding:16px 16px 90px}.page.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0}
input{width:100%;padding:12px;border-radius:12px;border:none;margin:8px 0}
button{border:none;border-radius:12px;padding:12px 16px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.danger{background:#c33;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#17191f;display:flex}
.nav button{flex:1;background:none;color:#fff;padding:14px}
.problem{font-size:24px;font-weight:bold;margin:20px 0}
.stat{font-size:32px;font-weight:bold}
.small{color:var(--muted)}
</style>
</head>
<body>

<div id="quiz" class="page active">
<div class="card">
<div class="small">連続正解 <span id="streak">0</span></div>
<div class="problem" id="q">問題を追加してください</div>
<input id="ans" placeholder="答え">
<button class="primary" onclick="check()">回答する</button>
<div id="result"></div>
</div>
</div>

<div id="add" class="page">
<div class="card">
<h3>問題追加</h3>
<input id="newQ" placeholder="問題">
<input id="newA" placeholder="答え">
<button class="primary" onclick="addProblem()">追加</button>
</div>
</div>

<div id="list" class="page">
<div id="listArea"></div>
</div>

<div id="stats" class="page">
<div class="card">
<div>総問題数</div><div class="stat" id="count">0</div>
<div>総正解率</div><div class="stat" id="rate">0%</div>
</div>
<div class="card"><h3>苦手ランキング</h3><div id="ranking"></div></div>
</div>

<div class="nav">
<button onclick="showPage('quiz')">🏠</button>
<button onclick="showPage('add')">➕</button>
<button onclick="showPage('list')">📚</button>
<button onclick="showPage('stats');renderStats()">📊</button>
</div>

<script>
let problems=[]; let current=-1; let streak=0;

function save(){localStorage.setItem("ankiLite",JSON.stringify(problems));}
function load(){problems=JSON.parse(localStorage.getItem("ankiLite")||"[]");}

function addProblem(){
 let q=newQ.value.trim(), a=newA.value.trim();
 if(!q||!a)return;
 problems.push({q,a,c:0,w:0});
 save(); newQ.value=""; newA.value="";
 renderList(); nextQuestion();
}

function acc(p){let t=p.c+p.w; return t?Math.round(p.c/t*100):0;}

function weightedIndex(){
 let total=0, weights=[];
 problems.forEach(p=>{let w=Math.pow(p.w+1,2)+(100-acc(p));weights.push(w);total+=w;});
 let r=Math.random()*total;
 for(let i=0;i<weights.length;i++){r-=weights[i]; if(r<=0)return i;}
 return 0;
}

function nextQuestion(){
 if(!problems.length){q.textContent="問題を追加してください"; return;}
 current=weightedIndex();
 q.textContent=problems[current].q;
 ans.value=""; result.innerHTML="";
}

function check(){
 if(current<0)return;
 let p=problems[current];
 if(ans.value.trim()===p.a){
   p.c++; streak++;
   result.innerHTML="<p>✅ 正解</p>";
 }else{
   p.w++; streak=0;
   result.innerHTML="<p>❌ 不正解<br>正解: "+p.a+"</p>";
 }
 document.getElementById("streak").textContent=streak;
 save(); renderList(); renderStats();
 setTimeout(nextQuestion,1200);
}

function renderList(){
 listArea.innerHTML="";
 [...problems].sort((a,b)=>acc(a)-acc(b)).forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="card";
  d.innerHTML=`<b>${p.q}</b><br>正解率 ${acc(p)}%<br>
  <button onclick="this.nextElementSibling.style.display='block'">答えを見る</button>
  <div style="display:none;margin-top:8px">${p.a}</div><br>
  <button class="danger" onclick="removeProblem('${encodeURIComponent(p.q)}')">削除</button>`;
  listArea.appendChild(d);
 });
}

function removeProblem(qv){
 let q=decodeURIComponent(qv);
 problems=problems.filter(x=>x.q!==q);
 save(); renderList(); renderStats(); nextQuestion();
}

function renderStats(){
 count.textContent=problems.length;
 let c=0,w=0;
 problems.forEach(p=>{c+=p.c;w+=p.w;});
 rate.textContent=(c+w)?Math.round(c/(c+w)*100)+"%":"0%";
 ranking.innerHTML="";
 [...problems].sort((a,b)=>acc(a)-acc(b)).slice(0,10).forEach((p,n)=>{
   ranking.innerHTML+=`<div>${n+1}. ${p.q} (${acc(p)}%)</div>`;
 });
}

function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

load(); renderList(); renderStats(); nextQuestion();
</script>
</body>
</html>
